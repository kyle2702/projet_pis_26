<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  <!-- Favicon: version AVIF 11 Ko du logo (le PNG original servait autant de
       favicon que d'icône de manifest et pesait 173 Ko pour 780x780).
       Les icônes de manifest/apple-touch sont désormais aux bonnes dimensions:
       voir scripts/optimize-images.mjs. -->
  <link rel="icon" type="image/avif" href="/logo_pionniers.avif" />
  <link rel="apple-touch-icon" href="/pionniers-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#0f766e">
  <!-- Polices auto-hébergées (public/fonts, générées par scripts/selfhost-fonts.mjs).
       Avant: @import Google Fonts dans index.css, donc découvert seulement APRÈS
       le CSS de l'app, avec 2 connexions tierces de plus avant le premier texte.
       Les 2 fichiers "latin" sont préchargés: ils couvrent tout le texte français
       (Manrope pour le corps, Sora pour les titres). -->
  <link rel="preload" href="/fonts/xn7gYHE41ni1AdIRggexSg.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/xMQ9uFFYT72X5wkB_18qmnndmSdSnh2BAfO5mnuyOo1lfiQwV6-x.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">
    <title>Pionniers 26</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
